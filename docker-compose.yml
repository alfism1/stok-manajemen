version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stok-manajemen-app
    container_name: stok-manajemen-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
    networks:
      - stok-manajemen-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - stok-manajemen-network

networks:
  stok-manajemen-network:
    driver: bridge
